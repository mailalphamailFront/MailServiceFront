name: Frontend (prod) - Build & Push to ECR on Release

on:
  release:
    types: [released]

permissions:
  contents: read
  id-token: write # OIDC 사용할 때 필요

env:
  AWS_REGION: ap-northeast-2
  # 예: "my-frontend" (ECR repo 이름)
  ECR_REPOSITORY: mail/front
  # 프론트 Dockerfile 위치 (프로젝트에 맞게 수정)
  FRONTEND_DIR: .
  DOCKERFILE_PATH: ./configs/Dockerfile

jobs:
  build-and-push:
    name: Build and push frontend image (prod)
    runs-on: ubuntu-latest

    # GitHub Environment "dev"를 쓰고 싶으면 아래 줄을 켜고,
    # secrets를 Environment(dev)에 저장하면 됨
    environment: prod

    # 정식 릴리스일 때만 실행 (prerelease 제외)
    if: ${{ github.event.release.prerelease == false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Access Key 방식(원하면 위 OIDC step 대신 이걸 사용)
      - name: Configure AWS credentials (Access Key)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: vars
        run: |
          # prerelease tag name (예: v0.1.0-dev.3)
          echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (ARM 크로스 빌드)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 선택: 빌드 캐시를 GH Actions 캐시에 저장 (빨라짐)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_DIR }}
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.SHA_TAG }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition front --query taskDefinition > task-definition.json

      # 2. Task Definition 파일의 이미지 주소를 방금 빌드한 새 이미지로 변경
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: front # ECS 작업 정의에 설정한 컨테이너 이름
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.TAG }}

      # 3. 변경된 Task Definition을 등록하고 ECS 서비스를 업데이트 (배포 시작)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: front-service
          cluster: mail_cluster
          wait-for-service-stability: false # 배포가 성공할 때까지 대기 (타임아웃 설정 가능)

